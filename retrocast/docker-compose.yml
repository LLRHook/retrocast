services:
  # Archive or restore the volume from a separate container; restore stops MinIO first.
  # Run only on demand; --rm removes every one-off container.
  backup-tools:
    image: alpine:3.24
    profiles: [operations]
    volumes:
      - minio-data:/data

  api:
    stop_grace_period: 20s
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgres://retrocast:${POSTGRES_PASSWORD}@db:5432/retrocast?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
      - MINIO_ENDPOINT=minio:9000
      - DOMAIN=${DOMAIN:-localhost}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - LIVEKIT_URL=ws://livekit:7880
    depends_on:
      minio-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  db:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    environment:
      - POSTGRES_DB=retrocast
      - POSTGRES_USER=retrocast
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrocast"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: retrocast-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    env_file: .env
    environment:
      - MINIO_ROOT_USER=retrocast
      - MINIO_REGION_NAME=${MINIO_REGION:-us-east-1}
    restart: unless-stopped

  # Required credentials; no root fallback. Logs never include mc output.
  minio-init:
    image: minio/minio:latest
    entrypoint: ["/bin/sh", "/init/minio-signer.sh"]
    env_file: .env
    environment:
      - MINIO_ROOT_USER=retrocast
      - MINIO_SIGNER_ACCESS_KEY=${MINIO_SIGNER_ACCESS_KEY:?set MINIO_SIGNER_ACCESS_KEY}
      - MINIO_SIGNER_SECRET_KEY=${MINIO_SIGNER_SECRET_KEY:?set MINIO_SIGNER_SECRET_KEY}
    volumes:
      - ./scripts/minio-signer.sh:/init/minio-signer.sh:ro
      - ./minio-signer-policy.json:/init/policy.json:ro
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  livekit:
    image: livekit/livekit-server:latest
    command: --bind 0.0.0.0 --udp-port 50000-50100
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    env_file: .env
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped

  web:
    build:
      context: ../retrocast-web
      dockerfile: Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
      - web
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-retrocast}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
  redis-data:
  caddy_data:
  prometheus-data:
  grafana-data:
